services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowledge_postgres:/var/lib/postgresql/data
      - ./database/postgresql.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - knowledge_vectors:/qdrant/storage
volumes:
  knowledge_postgres:
  knowledge_vectors:
